name: SAST

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  security-review:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 pinned to commit hash

      - uses: ./ # Points directly to action.yml
        with:
          comment-pr: true
          upload-results: true
          exclude-directories: "tests/vulnerable"
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          run-every-commit: true
